# ===========================================
# AI Studio Docker Compose 配置
# ===========================================
# 注意：此配置使用本地 PostgreSQL（不包含在 Docker 中）
#
# 前置要求：
#   - Windows: 安装 PostgreSQL 15+ (https://www.postgresql.org/download/)
#   - Ubuntu: sudo apt install postgresql-15
#   - macOS: brew install postgresql
#
# 启动前需创建数据库：
#   createdb -U postgres ai_studio
# ===========================================

services:
  neo4j:
    image: neo4j:5.18-community
    container_name: neo4j-ai-studio
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2g
      NEO4J_server_memory_pagecache_size: 1g
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./backend/data/neo4j:/data
      - ./backend/data/neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_PASSWORD:-password}' 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      default:
        aliases:
          - neo4j

  # 后端服务 (使用本地 PostgreSQL)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-studio-backend
    restart: unless-stopped
    environment:
      # 锁定为本地 SQLite（文章/会话历史只保存在本机 backend/data/ai_studio.db）
      DB_TYPE: sqlite
      # 本地 PostgreSQL 连接
      DB_HOST: ${DB_HOST:-localhost}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-ai_studio}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-60}
      TZ: Asia/Shanghai
      SCHEDULED_URL_TIMEOUT_SECONDS: ${SCHEDULED_URL_TIMEOUT_SECONDS:-180}
      SCHEDULED_PAGE_TIMEOUT_SECONDS: ${SCHEDULED_PAGE_TIMEOUT_SECONDS:-60}
      SCHEDULED_URL_RETRIES: ${SCHEDULED_URL_RETRIES:-0}
      SCHEDULED_RETRY_BACKOFF_SECONDS: ${SCHEDULED_RETRY_BACKOFF_SECONDS:-5}
      SCHEDULED_TASK_MAX_RUNTIME_SECONDS: ${SCHEDULED_TASK_MAX_RUNTIME_SECONDS:-1200}
      SCHEDULED_MAX_ARTICLES: ${SCHEDULED_MAX_ARTICLES:-10}
      CRAWL_PAGE_TIMEOUT_MS: ${CRAWL_PAGE_TIMEOUT_MS:-180000}
      # API 密钥
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
    ports:
      - "8500:8000"
    depends_on:
      - neo4j
    volumes:
      - ./backend:/app

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-studio-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://backend:8000
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

networks:
  default:
    name: ai-studio-network
    external: false